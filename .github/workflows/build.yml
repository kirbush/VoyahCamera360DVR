name: Build APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SDK and native compiler
        run: sdkmanager 'platforms;android-30' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - name: Test native request encoding
        run: |
          python -m pip install unicorn==2.1.4
          python scripts/test_native_protocol.py "$ANDROID_HOME/ndk/27.2.12479018"
      - name: Build and run core checks
        run: ./gradlew :app:corePolicyTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Voyah-Camera-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
